spring.application.name=backend
# Permite ejecutar desde backend/ o desde la raíz, sin copiar contraseñas.
spring.config.import=optional:file:../garage-db.properties,optional:file:./garage-db.properties
spring.datasource.url=${garage.db.url:jdbc:mysql://localhost:3306/garage_coffee}
spring.datasource.username=${garage.db.user:root}
spring.datasource.password=${garage.db.password:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
# Solo este equipo durante el desarrollo. No exponer credenciales por HTTP en la red.
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
