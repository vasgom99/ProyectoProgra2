spring.application.name=backend
# busca la configuración local de mysql.
spring.config.import=optional:file:../garage-db.properties,optional:file:./garage-db.properties
spring.datasource.url=${garage.db.url:jdbc:mysql://localhost:3306/garage_coffee}
spring.datasource.username=${garage.db.user:root}
spring.datasource.password=${garage.db.password:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
# limita el servidor a este equipo.
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
